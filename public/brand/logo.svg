<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <defs>
    <linearGradient id="wifLogoCrimsonTop" x1="24" y1="14" x2="56" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5E6A"/>
      <stop offset="55%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#B01E2B"/>
    </linearGradient>
    <linearGradient id="wifLogoCrimsonLeft" x1="16" y1="28" x2="42" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4D5A"/>
      <stop offset="100%" stop-color="#9E1B26"/>
    </linearGradient>
    <linearGradient id="wifLogoCrimsonRight" x1="40" y1="28" x2="64" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7580"/>
      <stop offset="100%" stop-color="#C82836"/>
    </linearGradient>
  </defs>

  <!-- Icon Mark Container -->
  <g transform="translate(8, 8)">
    <rect width="64" height="64" rx="16" fill="#0B0D0C"/>
    <circle cx="32" cy="32" r="29" stroke="#E63946" stroke-opacity="0.35" stroke-width="1.5"/>
    <!-- Top Crown Peak with dark cutout -->
    <polygon points="31,7 46,21 31,34 16,21" fill="url(#wifLogoCrimsonTop)"/>
    <polygon points="31,15 38,21.5 31,27.5 24,21.5" fill="#0B0D0C"/>
    <!-- Left Wing Bastion -->
    <polygon points="9,28 19,18 28,27 18,37" fill="url(#wifLogoCrimsonLeft)"/>
    <polygon points="9,28 18,37 28,47 19,55 9,44" fill="#C92835"/>
    <!-- Center Diamond Facet -->
    <polygon points="29,36 39,27 47,35 37,45" fill="#FF4D5A"/>
    <!-- Detached Isometric Tile -->
    <polygon points="41,49 49,41 56,48 48,56" fill="url(#wifLogoCrimsonRight)"/>
    <!-- Right Wing -->
    <polygon points="46,21 55,29 48,36 39,27" fill="#B8202D"/>
  </g>

  <!-- Typography -->
  <text x="88" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="900" letter-spacing="0.14em" fill="#FFFFFF">WIF WORLDS</text>
  <text x="89" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.28em" fill="#FF4D5A">THE LIVING MAP</text>
</svg>

