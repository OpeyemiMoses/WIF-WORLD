[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/"
]

# Robinhood Chain Mainnet RPC
[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"

[etherscan]
robinhood = { key = "none", url = "https://robinhoodchain.blockscout.com/api" }
